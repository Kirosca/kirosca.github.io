<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)" />
  
  <!-- 3D 几何与辅助坐标网格 -->
  <g stroke="rgba(56, 189, 248, 0.15)" stroke-width="1">
    <line x1="100" y1="300" x2="700" y2="300" />
    <line x1="400" y1="50" x2="400" y2="550" />
    <circle cx="400" cy="300" r="180" fill="none" stroke-dasharray="6,6" />
    <circle cx="400" cy="300" r="230" fill="none" opacity="0.4" />
  </g>

  <!-- 3D 机械立体核心 -->
  <g filter="url(#glow)">
    <!-- 外层多边形晶格 -->
    <polygon points="400,160 520,230 520,370 400,440 280,370 280,230" fill="rgba(14, 165, 233, 0.08)" stroke="url(#cyberNeon)" stroke-width="2.5" />
    
    <!-- 内层旋转立方体线框 -->
    <polygon points="400,200 490,250 490,350 400,400 310,350 310,250" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <line x1="400" y1="200" x2="400" y2="400" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="490" y1="250" x2="310" y2="350" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
    <line x1="310" y1="250" x2="490" y2="350" stroke="#38bdf8" stroke-width="1" opacity="0.6" />

    <!-- 聚能核心脉冲球 -->
    <circle cx="400" cy="300" r="45" fill="url(#cyberNeon)" opacity="0.9" />
    <circle cx="400" cy="300" r="60" fill="none" stroke="#67e8f9" stroke-width="2" stroke-dasharray="8,4" />
  </g>

  <!-- 标注与参数文字 -->
  <text x="400" y="495" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="22" text-anchor="middle" letter-spacing="3">MECHA CORE 3D</text>
  <text x="400" y="525" fill="#38bdf8" font-family="'Plus Jakarta Sans', monospace" font-size="12" text-anchor="middle" letter-spacing="2">PBR WORKFLOW · 12.4K TRIS · NORMAL / WIRE / ALBEDO</text>
</svg>