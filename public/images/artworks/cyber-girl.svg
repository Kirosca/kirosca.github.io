<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d24" />
      <stop offset="50%" stop-color="#1e163d" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="live2dNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad2)" />

  <!-- 动态波形与物理绑定节点装饰 -->
  <g stroke="rgba(236, 72, 153, 0.2)" stroke-width="1.5">
    <path d="M 120,480 Q 260,420 400,480 T 680,480" fill="none" stroke-dasharray="4,4" />
    <path d="M 150,510 Q 270,470 400,510 T 650,510" fill="none" opacity="0.6" />
    <circle cx="280" cy="220" r="4" fill="#ec4899" />
    <circle cx="520" cy="220" r="4" fill="#ec4899" />
    <line x1="280" y1="220" x2="400" y2="180" stroke="#a855f7" opacity="0.4" />
    <line x1="520" y1="220" x2="400" y2="180" stroke="#a855f7" opacity="0.4" />
  </g>

  <!-- 赛博少女立绘剪影与光效 -->
  <g filter="url(#glow2)">
    <!-- 头部与发丝剪影几何 -->
    <path d="M 330,140 C 360,110 440,110 470,140 C 510,180 500,270 470,300 C 440,330 360,330 330,300 C 300,270 290,180 330,140 Z" fill="rgba(168, 85, 247, 0.15)" stroke="url(#live2dNeon)" stroke-width="2.5" />
    <!-- 赛博耳机光环 -->
    <circle cx="310" cy="210" r="22" fill="#090514" stroke="#ec4899" stroke-width="3" />
    <circle cx="490" cy="210" r="22" fill="#090514" stroke="#ec4899" stroke-width="3" />
    <path d="M 310,190 C 340,130 460,130 490,190" fill="none" stroke="#ec4899" stroke-width="2.5" />
    
    <!-- 瞳孔与高光 -->
    <ellipse cx="365" cy="215" rx="14" ry="18" fill="#f43f5e" />
    <ellipse cx="435" cy="215" rx="14" ry="18" fill="#f43f5e" />
    <circle cx="368" cy="210" r="5" fill="#fff" />
    <circle cx="438" cy="210" r="5" fill="#fff" />

    <!-- 动态微风领带与机能装束 -->
    <path d="M 380,340 L 400,430 L 420,340 Z" fill="url(#live2dNeon)" opacity="0.9" />
  </g>

  <text x="400" y="495" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="22" text-anchor="middle" letter-spacing="3">CYBER GIRL LIVE2D</text>
  <text x="400" y="525" fill="#f43f5e" font-family="'Plus Jakarta Sans', monospace" font-size="12" text-anchor="middle" letter-spacing="2">PHYSICS SYSTEM · 9-AXIS TRACKING · 5 MOTION STATES</text>
</svg>